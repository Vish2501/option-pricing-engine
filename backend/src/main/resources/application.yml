spring:
  application:
    name: option-pricing-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/option_pricing}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

security:
  api-key: ${API_KEY:}

rate-limit:
  requests-per-minute: 60
  pricing-per-minute: 10
  pricing-per-hour-all-clients: 300

pricing:
  defaults:
    risk-free-rate: 0.05
    dividend-yield: 0.0
    monte-carlo-simulations: 10000
    binomial-steps: 500

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# FIX 4.4 quoting interface. Off by default so the REST API runs exactly as before.
fix:
  enabled: ${FIX_ENABLED:false}
  # Session settings (protocol version, who we are, who may connect).
  config-file: classpath:fix/acceptor.cfg
  port: ${FIX_PORT:9876}
  # Total bid/offer width in basis points of the theoretical price: 100 = 0.5% either side.
  spread-bps: 100
