# QuickFIX/J session settings for the pricing engine's FIX acceptor (server side).
# The listening port is not here: it comes from fix.port in application.yml.

[default]
# Acceptor = we wait for clients to connect, like a server.
ConnectionType=acceptor
# No daily start/end time; the session is available whenever the app is up.
NonStopSession=Y
# Start both sides' sequence numbers from 1 at every logon. Messages are kept in memory
# only, so there is nothing to resend after a restart.
ResetOnLogon=Y
# Check every incoming message against the standard FIX 4.4 dictionary. Malformed
# messages are rejected by the engine before they reach our code.
UseDataDictionary=Y
DataDictionary=FIX44.xml
# Tag 5001 (pricing model) is our own field and not in the standard dictionary.
# Tags 5000 and above are reserved for user-defined fields; this lets them through.
ValidateUserDefinedFields=N

[session]
# A session is identified by protocol version plus the two company IDs.
BeginString=FIX.4.4
SenderCompID=PRICER
TargetCompID=CLIENT
